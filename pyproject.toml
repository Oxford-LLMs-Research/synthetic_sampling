[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic_sampling"
version = "0.3.0"
description = "Generate respondent profiles from cross-national surveys and score LLM predictions"
readme = "README.md"
authors = [
  {name = "Oxford LLMs Research"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
license = {text = "MIT license"}
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "pyreadstat",
  "requests",
  "pyyaml",
]

[project.optional-dependencies]
semantic = ["sentence-transformers"]
dev = ["coverage", "mypy", "pytest", "ruff"]

[project.scripts]
ss-generate = "synthetic_sampling.cli_generate:main"
ss-score = "synthetic_sampling.cli_score:main"
ss-analyze = "synthetic_sampling.cli_analyze:main"

[project.urls]
homepage = "https://github.com/Oxford-LLMs-Research/synthetic_sampling"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"synthetic_sampling.surveys.metadata" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
