[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic_sampling"
version = "0.2.0"
description = "Generate configurable respondent profiles from cross-national survey metadata for LLM evaluation in social-science research"
readme = "README.md"
authors = [
  {name = "Ilya Boytsov", email = "ilyaboytsov1805@gmail.com"}
]
maintainers = [
  {name = "Ilya Boytsov", email = "ilyaboytsov1805@gmail.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
license = {text = "MIT license"}
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "sentence-transformers",
  "scipy",
  "pyreadstat",
]

[project.optional-dependencies]
semantic = [
    "sentence-transformers",
]
yaml = [
    "pyyaml",
]
all = [
    "sentence-transformers",
    "pyyaml",
]
dev = [
    "coverage",
    "mypy",
    "pytest",
    "ruff",
]

[project.urls]

bugs = "https://github.com/iboytsov/synthetic_sampling/issues"
changelog = "https://github.com/iboytsov/synthetic_sampling/blob/master/changelog.md"
homepage = "https://github.com/iboytsov/synthetic_sampling"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"synthetic_sampling.profiles.metadata" = ["**/*.json"]




# Mypy
# ----

[tool.mypy]
files = "."

# Use strict defaults
strict = true
warn_unreachable = true
warn_no_return = true

[[tool.mypy.overrides]]
# Don't require test functions to include types
module = "tests.*"
allow_untyped_defs = true
disable_error_code = "attr-defined"

